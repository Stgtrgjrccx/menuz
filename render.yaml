services:
  # 🍽️ SITE 1: CUSTOMER DINING & MENU PORTAL
  # Public discovery, Pune landmark menus, table QR multiplayer cart
  # Completely independent, not locked to any specific restaurant
  - type: web
    name: menuz-customer
    runtime: static
    buildCommand: npm install && npm run build:customer
    staticPublishPath: ./dist-customer
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # 🧑‍🍳 SITE 2: RESTAURANT OWNER & PARTNER OPERATIONS PORTAL
  # Generic partner hub for all restaurant owners, live floor ops, KDS, review shield
  # Completely independent, not locked to any specific restaurant
  - type: web
    name: menuz-owner
    runtime: static
    buildCommand: npm install && npm run build:owner
    staticPublishPath: ./dist-owner
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
